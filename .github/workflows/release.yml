name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.12.1
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check -- "$GITHUB_REF_NAME"
      - run: pnpm verify
      - run: mkdir release && pnpm pack --pack-destination release
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-kit-package
          path: release/*.tgz
      - name: Publish public package
        run: npm publish ./release/*.tgz --access public
        env:
          # Needed only to bootstrap the first version. npm uses trusted-publisher
          # OIDC before falling back to this secret; remove it after setup.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm test:registry -- "$GITHUB_REF_NAME"
